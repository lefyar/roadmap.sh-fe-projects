<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="main">
      <header class="header">
        <h1>Image Grid Layout</h1>
        <p>Select a photo to view it at full size.</p>
      </header>
      <div class="grid" id="grid"></div>
    </main>
    <dialog id="lightbox" class="lightbox" aria-labelledby="lightboxCaption">
      <figure class="lightbox-content">
        <button type="button" class="lightbox-close" id="lightboxClose">Close</button>
        <img class="lightbox-img" id="lightboxImg" alt="" />
        <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
      </figure>
    </dialog>
  </body>
</html>
