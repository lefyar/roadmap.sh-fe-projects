<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="container">
      <form id="profileForm" novalidate>
        <h1>Profile form</h1>
        <p class="form-note">Try the form with sample details.</p>
        <fieldset class="form-field">
          <label for="name">
            <span>Full Name</span>
            <input type="text" id="name" aria-describedby="nameError" required />
          </label>
          <span id="nameError" class="error-message"></span>
        </fieldset>

        <fieldset class="form-field">
          <label for="email">
            <span>Email</span>
            <input type="email" id="email" aria-describedby="emailError" required />
          </label>
          <span id="emailError" class="error-message"></span>
        </fieldset>

        <fieldset class="form-field">
          <label for="password">
            <span>Enter password</span>
            <input type="password" id="password" autocomplete="new-password" minlength="8" aria-describedby="strengthText passwordError" required />
          </label>
          <div class="password-strength" aria-live="polite">
            <div id="strengthMeter" class="strength-meter"></div>
            <span id="strengthText">Enter at least 8 characters.</span>
          </div>
          <span id="passwordError" class="error-message"></span>
        </fieldset>

        <fieldset class="form-field">
          <label for="confirm-password">
            <span>Confirm password</span>
            <input type="password" id="confirm-password" autocomplete="new-password" aria-describedby="confirmError" required />
          </label>
          <span id="confirmError" class="error-message"></span>
        </fieldset>

        <fieldset class="form-field">
          <legend>Role</legend>
          <div class="radio-group" role="radiogroup" aria-label="Role">
            <label class="radio-option">
              <input type="radio" name="role" value="developer" checked />
              <span>Developer</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="role" value="designer" />
              <span>Designer</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="role" value="other" />
              <span>Other</span>
            </label>
          </div>
        </fieldset>

        <input type="submit" id="submitBtn" value="Validate profile" disabled />
        <p id="formStatus" role="status"></p>
      </form>

      <div class="profile-completeness">
        <div class="progress-bar">
          <div class="progress" id="progressBar">
            <span id="progressText">Profile Completeness</span>
          </div>
        </div>
        <div class="checklist">
          <ul>
            <li data-completed="true"><del>Create an account</del></li>
            <li data-completed="true"><del>Update Roadmap Progress</del></li>
            <li data-completed="true"><del>Setup Public Profile</del></li>
            <li>Complete your first project</li>
            <li>Invite your friends</li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
