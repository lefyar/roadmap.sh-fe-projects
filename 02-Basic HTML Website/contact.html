<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Basic HTML Website</title>
    <meta name="description" content="Basic HTML-only Website by Edma Reyfaldy" />
    <meta name="keywords" content="Basic HTML Website, HTML, CSS" />
    <meta name="author" content="Edma Reyfaldy" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="../contact.js"></script>
  </head>
  <body>
    <header>
      <div class="logo">
        <img width="50" src="./logo.jpg" alt="" />
        <p class="site-name">Edma Reyfaldy</p>
      </div>
      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./articles.html">Articles</a></li>
          <li><a href="./contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contact">
        <h1>Contact Me</h1>
        <p>Write and copy a draft, then send it to me on <a href="https://www.linkedin.com/in/lefyar">LinkedIn</a>.</p>
        <form class="contact-form">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required />
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" placeholder="What would you like to say?" rows="6" required></textarea>
          </div>
          <button type="submit" disabled>Copy message draft</button>
          <p role="status"></p>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Edma Reyfaldy, All Rights Reserved</p>
    </footer>
  </body>
</html>
