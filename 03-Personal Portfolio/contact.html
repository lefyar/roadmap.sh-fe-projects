<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Personal Portfolio by Edma Reyfaldy" />
    <meta name="keywords" content="Personal Portfolio, HTML, CSS" />
    <meta name="author" content="Edma Reyfaldy" />
    <link rel="stylesheet" href="./style.css" />

  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./logo.jpg" alt="" />
        <p class="site-name">Edma Reyfaldy</p>
      </div>
      <div class="navigation">
        <nav>
          <ul>
            <li><a href="./index.html">Home</a></li>

            <li><a href="./contact.html" class="active" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="contact-detail">
        <h1>Contact Me</h1>
        <p>Write and copy a draft, then send it to me on <a href="https://www.linkedin.com/in/lefyar">LinkedIn</a>.</p>
        <form class="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" required />
          <label for="email">Email</label>
          <input type="email" id="email" required />
          <label for="message">Message</label>
          <textarea id="message" rows="6" required></textarea>
          <button type="submit" disabled>Copy message draft</button>
          <p role="status"></p>
        </form>
      </section>
    </main>
    <footer class="footer">&copy; 2025 Edma Reyfaldy, All Rights Reserved</footer>
  </body>
