<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Task Tracker</h1>
      <form id="taskForm">
        <label for="taskInput">New task</label>
        <div class="task-entry">
          <input type="text" id="taskInput" required maxlength="200" />
          <button type="submit" class="addTaskBtn">Add task</button>
        </div>
      </form>
      <p id="emptyTasks">No tasks yet.</p>
      <p id="taskNotice" role="status"></p>
      <ul id="taskList"></ul>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
