<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="picker">
      <header>
        <h1>Datepicker</h1>
      </header>
      <label for="dateInput">Selected date</label>
      <div class="date-row">
        <input id="dateInput" readonly placeholder="dd/mm/yyyy">
        <button id="openButton" type="button" aria-haspopup="dialog">Choose date</button>
      </div>
    </main>
    <dialog id="calendar" aria-labelledby="month">
      <header>
        <button id="prevButton" type="button" aria-label="Previous month">‹</button>
        <h2 id="month" aria-live="polite"></h2>
        <button id="nextButton" type="button" aria-label="Next month">›</button>
      </header>
      <table role="grid" aria-labelledby="month">
        <thead><tr id="weekdays"></tr></thead>
        <tbody id="days"></tbody>
      </table>
      <footer>
        <button id="todayButton" type="button">Go to today</button>
        <button id="closeButton" type="button">Close</button>
      </footer>
    </dialog>
  </body>
</html>
