<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Random Repository</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>GitHub Random Repository</h1>
      <p>Find a public repository by programming language.</p>
      <form>
        <label for="language-select">Language</label>
        <select id="language-select">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        </select>
        <button id="fetch-button" type="submit">Find repository</button>
      </form>
      <p id="status-message" role="status"></p>
      <article id="result-container" class="repo-card" hidden></article>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
