<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Tabs</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main>
      <h1>Simple Tabs</h1>
      <div class="navbar">
        <ul role="tablist" aria-label="Tabs">
          <li role="presentation"><button type="button" role="tab" id="tab-trigger-1" aria-selected="true" tabindex="0" aria-controls="tab1">First Tab</button></li>
          <li role="presentation"><button type="button" role="tab" id="tab-trigger-2" aria-selected="false" tabindex="-1" aria-controls="tab2">Second Tab</button></li>
          <li role="presentation"><button type="button" role="tab" id="tab-trigger-3" aria-selected="false" tabindex="-1" aria-controls="tab3">Third Tab</button></li>
          <li role="presentation"><button type="button" role="tab" id="tab-trigger-4" aria-selected="false" tabindex="-1" aria-controls="tab4">Fourth Tab</button></li>
        </ul>
      </div>
      <div class="content">
      <div id="tab1" class="tab-content active" role="tabpanel" aria-labelledby="tab-trigger-1" tabindex="0">
        <h2>First Tab</h2>
        <p>Use the Left and Right Arrow keys to move through the tabs.</p>
      </div>
      <div id="tab2" class="tab-content" role="tabpanel" aria-labelledby="tab-trigger-2" tabindex="0" hidden>
        <h2>Second Tab</h2>
        <p>Home selects the first tab. End selects the last tab.</p>
      </div>
      <div id="tab3" class="tab-content" role="tabpanel" aria-labelledby="tab-trigger-3" tabindex="0" hidden>
        <h2>Third Tab</h2>
        <p>Press Tab to move from the selected tab into its panel.</p>
      </div>
      <div id="tab4" class="tab-content" role="tabpanel" aria-labelledby="tab-trigger-4" tabindex="0" hidden>
        <h2>Fourth Tab</h2>
        <p>The selected panel stays visible until you choose another tab.</p>
      </div>
      </div>
    </main>
  </body>
</html>
