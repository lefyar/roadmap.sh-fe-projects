<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Age Calculator</h1>
      <form id="age-form" class="age-form" novalidate>
        <div class="form-field">
          <label for="birthdate">Enter your birth date:</label>
          <input type="date" id="birthdate" min="0001-01-01" required />
        </div>
        <button type="submit">Calculate Age</button>
      </form>
      <div id="result" class="result">
        <div role="status">
          <p id="ageLine" class="result-main">Enter your birth date to see your age.</p>
          <p class="result-secondary" id="nextBirthday"></p>
        </div>
        <button type="button" id="copyBtn" class="copy-btn" hidden>Copy result</button>
        <p id="copyStatus" role="status"></p>
      </div>
    </div>
  </body>
</html>
