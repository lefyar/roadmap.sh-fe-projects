<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="container">
      <div class="header">
        <h1>Temperature Converter</h1>
        <p>Enter the temperature and pick the units.</p>
      </div>
      <form id="temp-form" class="form">
        <div class="form-row">
          <div class="form-field">
            <label for="temp-value">Value</label>
            <input type="number" id="temp-value" placeholder="0.00" step="any" />
          </div>
          <div class="form-field">
            <label for="from-unit">From</label>
            <select id="from-unit">
              <option value="celsius">Celsius</option>
              <option value="fahrenheit">Fahrenheit</option>
              <option value="kelvin">Kelvin</option>
            </select>
          </div>
          <div class="form-field">
            <label for="to-unit">To</label>
            <select id="to-unit">
              <option value="celsius">Celsius</option>
              <option value="fahrenheit" selected>Fahrenheit</option>
              <option value="kelvin">Kelvin</option>
            </select>
          </div>
        </div>
        <div class="result" id="result" role="status" aria-live="polite">
          <p>Enter a temperature to see the result.</p>
        </div>
      </form>
    </main>
  </body>
</html>
