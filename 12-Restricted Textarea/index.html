<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restricted Textarea</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Restricted Textarea</h1>
      <label for="myTextarea">Message</label>
      <div class="textarea">
        <textarea
          id="myTextarea"
          placeholder="Start typing"
          aria-describedby="limit-hint"
          maxlength="250"
        ></textarea>
        <div class="counter">
          <p id="charCounter" role="status">0 / 250</p>
          <button type="button" id="copyBtn" class="copy-btn" disabled>Copy</button>
        </div>
      </div>
      <p id="limit-hint" class="limit-hint">Up to 250 characters.</p>
      <p id="toast" role="status"></p>
    </main>
  </body>
</html>
